name: Generate Complete Container APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_container_apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Your Custom Code
      uses: actions/checkout@v4
      with:
        path: custom_src

    - name: Set up Java JDK Environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Download Open-Source BlackBox Core
      run: |
        git clone https://github.com/ALEX5402/NewBlackbox

    - name: Merge Un-Gated Custom Files into Framework
      run: |
        # Override the manifest with our multi-process slot definitions
        cp custom_src/AndroidManifest.xml blackbox_core/app/src/main/AndroidManifest.xml
        
        # Inject our bypass MainActivity and Overlay Canvas
        mkdir -p blackbox_core/app/src/main/java/com/predictor
        cp custom_src/java/com/predictor/*.java blackbox_core/app/src/main/java/com/predictor/
        
        # Merge our native memory pointer loop files into the NDK workspace
        mkdir -p blackbox_core/app/src/main/jni
        cp custom_src/jni/* blackbox_core/app/src/main/jni/

    - name: Build Standalone Un-Gated APK Package
      run: |
        cd blackbox_core
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload Completed APK Installation Artifact
      uses: actions/upload-artifact@v4
      with:
        name: carrom-predictor-pro
        path: blackbox_core/app/build/outputs/apk/release/*.apk
