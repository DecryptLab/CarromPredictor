name: Build Native Engine Module

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_native:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Android NDK Environment
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '25.2.9519653'

    - name: Execute Android Clang Compiler Matrix
      run: |
        cd jni
        ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a

    - name: Archive Compiled Native Library
      uses: actions/upload-artifact@v4
      with:
        name: compiled-skia-ext-binary
        path: libs/arm64-v8a/libskia_ext.so
